# nginx/nginx.conf

# Run as a non-root user for security
user nginx;

# Set the number of worker processes automatically based on the number of CPU cores
worker_processes auto;

# Log errors to the specified location
error_log /var/log/nginx/error.log warn;

# Define the process ID file location
pid /var/run/nginx.pid;

events {
    worker_connections 1024; # Maximum number of connections per worker
}

http {
    include /etc/nginx/mime.types; # Include MIME types
    default_type application/octet-stream;

    # Log format for access logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve static files
    server {
        listen 80; # Listen on port 80

        # Root directory for serving files
        root /usr/share/nginx/html;

        # Enable caching for static assets
        location /static/ {
            expires 1y;
            add_header Cache-Control "public";
        }

        # Handle React Router routes
        location / {
            try_files $uri /index.html;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}